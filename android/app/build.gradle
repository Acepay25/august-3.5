import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Single source of truth for versions: the root package.json. release.yml
// validates the git tag against it and electron-builder stamps it into the
// installer, so the APK must derive its version instead of hand-bumping a
// rotting "1" / "1.0" pair here. Dependency-free (JsonSlurper ships with
// Groovy). versionCode = major*10000 + minor*100 + patch (supports 0-99
// minor/patch, which semver-in-practice covers for this app); versionName =
// the raw semver string. A pre-release suffix ("1.2.0-beta.1") is stripped
// from the code but kept in the name.
def packageJsonFile = new File(projectDir, '../../package.json')
def packageJson = new JsonSlurper().parse(packageJsonFile)
def semver = (packageJson.version as String).trim()
def coreParts = semver.split('-')[0].split('\\.')
def appVersionCode = (coreParts[0] as int) * 10000 + (coreParts[1] as int) * 100 + (coreParts.size() > 2 ? (coreParts[2] as int) : 0)

// ── Release signing — OPTIONAL and self-disarming (audit 2026-09-16) ───────
// The MECHANISM only; the certificate itself is still a purchase/creation
// decision. If android/keystore.properties exists (created by hand, or
// provisioned in CI from the ANDROID_KEYSTORE_B64 secrets — see
// .github/workflows/release.yml "Provision Android signing"), the release
// build type gets a real signingConfig. Without it — the state of the world
// today — the release build stays UNSIGNED with a loud console warning,
// exactly the previous behavior, and no build fails.
// Expected properties (relative paths resolve against the android/ dir):
//   storeFile=release.keystore
//   storePassword=…  keyAlias=…  keyPassword=…
// NOTE: keystore.properties and *.jks are NOT covered by android/.gitignore
// (the template lines are commented out) — the file must never be committed.
def keystoreProperties = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
def releaseSigningReady = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProperties.load(it) }
    def missingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .findAll { key -> !keystoreProperties.getProperty(key)?.trim() }
    if (missingKeys) {
        logger.warn("[signing] android/keystore.properties present but incomplete (missing ${missingKeys.join(', ')}) — release build stays UNSIGNED")
    } else {
        def store = new File(rootDir, keystoreProperties['storeFile'])
        if (store.exists()) {
            releaseSigningReady = true
        } else {
            logger.warn("[signing] keystore file '${store}' referenced by android/keystore.properties does not exist — release build stays UNSIGNED")
        }
    }
} else {
    logger.warn("[signing] No android/keystore.properties — release APK/AAB stays UNSIGNED (debug installs unaffected; see the signing block in android/app/build.gradle)")
}

android {
    namespace "com.august35.tradingapp"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.august35.tradingapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName semver
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile new File(rootDir, keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed ONLY when android/keystore.properties was complete at
            // configuration time; otherwise the release build keeps the AGP
            // default (unsigned) exactly as before.
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

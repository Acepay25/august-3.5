name: Build & Release

# Verify gates live on CI (push/PR to main). This job only packages.
# Tag must still match package.json (v1.0.12 === version 1.0.12).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag $env:GITHUB_REF_NAME does not match package version v$version" }

      - name: Build renderer (Vite)
        run: npm run build

      - name: Reject public source maps
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse dist -Filter *.map -ErrorAction SilentlyContinue) { throw 'Source maps must not be included in release output' }

      - name: End-to-end smoke
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Build & publish Electron app
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

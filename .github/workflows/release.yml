name: Build & Release

# Verify gates are duplicated here on purpose: release.yml can be dispatched
# manually (workflow_dispatch) without ever having passed CI, and publishing
# to every updater is irreversible. Tag must still match package.json
# (e.g. tag v1.0.24 === version 1.0.24 in package.json).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Cheap-first: a bad tag must fail BEFORE any step that consumes
      # secrets (the Android-signing detection below reads ANDROID_*).
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag $env:GITHUB_REF_NAME does not match package version v$version" }

      # Android release signing MECHANISM (audit 2026-09-16) — dormant until
      # the repo secrets exist, and a no-op even then until an Android build
      # step is added (this workflow ships Electron only). When ANDROID_KEYSTORE_B64
      # is set, the base64 .jks is decoded to android/release.keystore and its
      # companion secrets are written to android/keystore.properties, which
      # android/app/build.gradle consumes — and ONLY then signs the release.
      # NOTE: `secrets` is NOT an available context in step-level `if:` (a
      # `secrets.X` reference there fails the whole workflow with an invalid-
      # file, zero-job run on every push), so presence is bridged through a
      # step output; secrets are only read via `env:`, where they ARE allowed.
      - name: Detect Android signing secrets
        id: android-signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if ($env:ANDROID_KEYSTORE_B64) { 'present=true' >> $env:GITHUB_OUTPUT }
          else { 'present=false' >> $env:GITHUB_OUTPUT }

      - name: Provision Android signing (no-op unless ANDROID_KEYSTORE_B64 is set)
        if: steps.android-signing.outputs.present == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $b64 = ($env:ANDROID_KEYSTORE_B64 -replace '\s', '')
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'android/release.keystore'), [Convert]::FromBase64String($b64))
          @(
            'storeFile=release.keystore'
            "storePassword=$env:ANDROID_KEYSTORE_PASSWORD"
            "keyAlias=$env:ANDROID_KEY_ALIAS"
            "keyPassword=$env:ANDROID_KEY_PASSWORD"
          ) | Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'android/keystore.properties') -Encoding ascii
          Write-Host 'Provisioned android/release.keystore + android/keystore.properties (picked up by app/build.gradle)'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      # Scripts/electron tooling types (tsconfig.scripts.json) — parity with
      # ci.yml. `npm run build` only runs the APP tsc (tsconfig.app/), so
      # without this a typecheck:scripts-only file could break unreleased.
      - name: Typecheck scripts
        run: npm run typecheck:scripts

      # The packaged app is the only place an electron/*.cjs break surfaces,
      # and this workflow is what puts it on users' machines — parse the shell
      # before electron-builder runs.
      - name: Electron shell parses
        run: npm run typecheck:electron

      - name: Build renderer (Vite)
        run: npm run build

      - name: Reject public source maps
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse dist -Filter *.map -ErrorAction SilentlyContinue) { throw 'Source maps must not be included in release output' }

      - name: End-to-end smoke
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      # Prod-bundle boot probe (v1.0.20 splash-hang lesson): serves dist/ via
      # vite preview and fails on any pageerror. Needs the chromium installed
      # by the smoke step above.
      - name: Boot probe (production bundle)
        run: npm run boot-probe

      # The only gate that measures what actually RENDERED rather than what
      # started: per-conversation row counts in a real browser, every control on
      # Learn and Journal pressed to prove none is inert, and zero pageerrors
      # across all six surfaces. It runs before any packaging, so a renderer
      # that drops rows cannot reach an installer from here.
      - name: Render probe (rendered rows, inert controls, zero pageerrors)
        run: npm run render-probe

      # Packaged-Electron smoke (v1.0.20 / v1.0.25 lessons): the renderer-only
      # boot probe cannot catch prod-only failures that live inside the
      # packaged main → app:// → renderer chain (custom protocol registration,
      # safeStorage availability, auto-update IPC, packaged provider wire,
      # window-state persistence). Build the unpacked output first, drive the
      # real exe with Playwright's Electron API and a scratch user-data-dir,
      # and ONLY then build + publish the NSIS installer. A smoke failure here
      # blocks publish.
      - name: Build unpacked Electron app (for installer smoke)
        run: npx electron-builder --dir --win

      - name: Installer smoke (packaged Electron boot)
        run: npm run installer-smoke
        env:
          INSTALLER_SMOKE_EXECUTABLE: dist_electron/win-unpacked/August Trading.exe

      # Code-signing, same presence-bridge pattern as the Android step above
      # (`secrets` is not available in a step-level `if:`, so presence rides out
      # on a step output). electron-builder reads CSC_LINK/CSC_KEY_PASSWORD
      # natively, so no extra step is needed once the secrets exist.
      - name: Detect Windows signing secrets
        id: win-signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if ($env:CSC_LINK) { 'present=true' >> $env:GITHUB_OUTPUT }
          else { 'present=false' >> $env:GITHUB_OUTPUT }

      # Build the installer for real, so the signature gate below has the
      # ACTUAL published artifact to judge rather than the --dir build above.
      - name: Build signed Electron installer
        shell: pwsh
        run: |
          if ("${{ steps.win-signing.outputs.present }}" -ne "true") {
            Write-Host "::warning::No CSC_LINK secret - this installer will be UNSIGNED and the signature gate below will fail unless the ALLOW_UNSIGNED_RELEASE repository variable is set to 'true'."
          }
          npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Fail closed on an unsigned build. This release configures no
      # build.publish.publisherName, so electron-updater's NsisUpdater has
      # nothing to compare a downloaded installer's signer against, returns
      # null, and treats that as a pass — the auto-update channel carries no
      # publisher identity. Shipping unsigned is a deliberate choice, so it
      # requires the ALLOW_UNSIGNED_RELEASE repo variable rather than being
      # inherited by omission.
      - name: Require a signed installer
        run: node scripts/verify-release-signature.cjs
        env:
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}

      - name: Build & publish Electron app
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

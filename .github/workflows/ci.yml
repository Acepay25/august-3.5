name: CI

# Fast gates on every push/PR. Release.yml assumes these passed on main
# and only packages the Electron installer (plus a Playwright smoke).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Type check scripts
        run: npm run typecheck:scripts

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

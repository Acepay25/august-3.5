# Third-party actions are pinned to COMMIT SHAs, not mutable tags: a tag can be
# moved by whoever owns it, and these files build and sign what users install.
name: CI

# The gate ladder lives in .github/actions/verify/action.yml. This workflow and
# release.yml both run that ONE definition, so the two cannot drift apart — they
# did: release skipped the docs gate and the skill-approval probe for a while.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        uses: ./.github/actions/verify

# Third-party actions are pinned to COMMIT SHAs, not mutable tags: a tag can be
# moved by whoever owns it, and these files build and sign what users install.
name: CI

# Fast gates on every push/PR. Release.yml assumes these passed on main
# and only packages the Electron installer (plus a Playwright smoke).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Type check scripts
        run: npm run typecheck:scripts

      # tsc and vitest cannot see a doc line number. The flow docs carry hundreds of them
      # (the gate prints the live count), and they have gone stale three times during this
      # deletion, so the scan runs before anything that costs a build.
      - name: Flow docs cite real lines
        run: npm run check-flow-doc-anchors

      # tsc excludes electron/*.cjs and vitest never imports the main process,
      # so a syntax break in the desktop shell is invisible to every other gate
      # here — and it only shows up when a user launches the packaged app.
      - name: Electron shell parses
        run: npm run typecheck:electron

      - name: Lint
        run: npm run lint

      # The unit and end-to-end suites were removed on 2026-10-23, but the
      # probes below drive real Chromium, so the browser install stays.
      - name: Install Chromium for the probes
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      # Verify the PRODUCTION bundle boots (e2e above only covers `npm run
      # dev`; v1.0.20 shipped a prod-only splash hang). Needs the chromium
      # installed by the smoke step.
      - name: Boot probe (production bundle)
        run: npm run boot-probe

      # boot-probe asks only "does it start". This is the gate that can see the
      # transcript — it counts rendered rows per conversation, presses every
      # control on the Learn and Journal surfaces and asserts each one does
      # something, and sweeps all four nav surfaces for pageerrors. A row
      # dropped after the second one is invisible without it.
      # Sequential here, so it is not running alongside a build — the one
      # condition its own flake note warns about.
      - name: Render probe (rendered rows, inert controls, zero pageerrors)
        run: npm run render-probe

      # The human-actuation path. `approveSkillDraft` and the queue's Apply were
      # unit-green while NOTHING had ever pressed the button in a browser, so the
      # read-back guard and the "it did not save" toasts were untested claims —
      # and this probe existed and was still not wired to run. It drives the four
      # draft outcomes (saved / name collision / duplicate / no folder) plus the
      # queue Apply, and asserts the notebook BYTES after each click.
      - name: Skill-approval probe (real clicks, notebook bytes after each)
        run: npm run skill-approval-probe


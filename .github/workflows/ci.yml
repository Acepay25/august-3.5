name: CI

# Fast gates on every push/PR. Release.yml assumes these passed on main
# and only packages the Electron installer (plus a Playwright smoke).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Type check scripts
        run: npm run typecheck:scripts

      # tsc excludes electron/*.cjs and vitest never imports the main process,
      # so a syntax break in the desktop shell is invisible to every other gate
      # here — and it only shows up when a user launches the packaged app.
      - name: Electron shell parses
        run: npm run typecheck:electron

      # Runs WITH coverage so vitest.config.ts's ratchet floors (36/28/36/30)
      # are actually enforced — they were configured but never executed by any
      # gate, so coverage could fall under the floor without failing anything.
      - name: Tests
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: End-to-end smoke
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Production build
        run: npm run build

      # Verify the PRODUCTION bundle boots (e2e above only covers `npm run
      # dev`; v1.0.20 shipped a prod-only splash hang). Needs the chromium
      # installed by the smoke step.
      - name: Boot probe (production bundle)
        run: npm run boot-probe

      # boot-probe asks only "does it start". This is the gate that can see the
      # transcript — it counts rendered rows per conversation, presses every
      # control on the Learn and Journal surfaces and asserts each one does
      # something, and sweeps all six nav surfaces for pageerrors. Unit tests
      # mount components in jsdom and cannot catch a row dropped after the
      # second one, which is how two finished panels shipped unmounted.
      # Sequential here, so it is not running alongside a build — the one
      # condition its own flake note warns about.
      - name: Render probe (rendered rows, inert controls, zero pageerrors)
        run: npm run render-probe

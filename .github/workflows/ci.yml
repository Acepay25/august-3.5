name: CI

# Verify every push/PR before a release tag — previously main got zero
# feedback until a `v*` tag triggered release.yml (typecheck/test/lint/build
# failures only surfaced at release time). e2e + electron-builder stay on the
# tag job; this covers the fast, deterministic gates.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Type check scripts
        run: npm run typecheck:scripts

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
  <!-- CSP: blocks script/style injection and inline handlers. Needed because
       AI-generated content is rendered into the DOM; without it any
       prompt-injection that escapes React's escaping runs in the origin.
       - script-src 'self': bundled modules only (no inline scripts)
       - connect-src: provider APIs (https), WebSocket price feeds (wss/ws),
         Vite dev HMR (ws://localhost), Electron app:// protocol, blob/data
         for workers + shared images
       - img-src: self + data: (base64 chart images) + blob: -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' app:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' app: https: wss: ws: blob: data:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'" />
  <title>August 3.5</title>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden">
  <div id="root" class="h-dvh w-full relative">
    <!-- Inline splash screen — removed automatically when React mounts -->
    <div id="splash" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0c0c0e;z-index:9999;">
      <div style="font-size:1.5rem;font-weight:700;color:#e7e7e9;letter-spacing:-0.025em;">August 3.5</div>
       <div class="splash-spinner"></div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>

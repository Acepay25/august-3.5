<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
  <!-- CSP: blocks script/style injection and inline handlers. Needed because
       AI-generated content is rendered into the DOM; without it any
       prompt-injection that escapes React's escaping runs in the origin.
       - script-src 'self' + TradingView's host: bundled modules only, plus the
         TradingView widget loader (Live Market / Trade chart).
       - connect-src: provider APIs (https), WebSocket price feeds (wss/ws),
         Vite dev HMR (ws://localhost), Electron app:// protocol, blob/data
         for workers + shared images
       - frame-src: TradingView's chart iframe (no other embeds)
       - img-src: self + data: (base64 chart images) + blob: + TradingView assets -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' app:; script-src 'self' https://s3.tradingview.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://s3.tradingview.com https://www.tradingview.com; font-src 'self' data:; connect-src 'self' app: https: wss: ws: blob: data:; worker-src 'self' blob:; frame-src https://s3.tradingview.com https://www.tradingview.com https://tradingview.com; object-src 'none'; base-uri 'self'" />
  <title>August Trading</title>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden">
  <!-- Inline splash screen — lives OUTSIDE #root so React's mount-clear can't
       yank it; index.tsx fades it out once React has rendered. Kept as plain
       HTML + CSS so it paints before any JS (and CSP needs no inline script). -->
  <div id="splash" aria-label="August Trading is loading">
    <div class="splash-glow" aria-hidden="true"></div>
    <div class="splash-wordmark">August Trading</div>
    <div class="splash-candles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="splash-track" aria-hidden="true"><div class="splash-bar"></div></div>
    <div class="splash-status" aria-hidden="true">
      <span>Loading modules</span>
      <span>Restoring session</span>
      <span>Connecting market data</span>
    </div>
  </div>
  <div id="root" class="h-dvh w-full relative"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
